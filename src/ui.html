<title>한판 광산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 위 띠(광석 주머니) + 아래 넓은 작업장 — 캠프(스킬 트리·곡괭이·재능·랭킹 + 오른쪽 장비 칸) ↔ 채굴장(캔버스 가득) */
:root {
  --soot: #110e0c;      /* 바탕: 갱도 그을음 */
  --rock: #1c1714;      /* 판 */
  --rock-2: #272019;    /* 올라온 판 */
  --seam: #3d3229;      /* 선 */
  --dust: #a8967f;      /* 흐린 글자 */
  --parch: #f1e6d2;     /* 글자 */
  --lamp: #f2a541;      /* 등불 (강조) */
  --lamp-deep: #a8601a;
  --ember: #ff6a3d;     /* 경고 */
  --moss: #9bd17f;      /* 살 수 있음 */
  --display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--soot); color: var(--parch); font: 14px/1.5 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; overflow: hidden; display: grid; grid-template-rows: auto 1fr; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ── 위 띠 ── */
.top { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: linear-gradient(#1f1915, #16120f); border-bottom: 1px solid var(--seam); min-width: 0; }
.brand { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; color: var(--lamp); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.bag { display: flex; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
.ore { display: flex; align-items: center; gap: 5px; padding: 4px 8px 4px 5px; border-radius: 8px; background: var(--rock); border: 1px solid var(--seam); white-space: nowrap; min-width: 0; transition: transform .12s; }
.ore svg { width: 18px; height: 18px; flex: none; }
.ore b { font-weight: 700; font-size: 13px; }
.ore.lock { opacity: .28; }
.ore.bump { transform: translateY(-3px); border-color: var(--lamp-deep); }
.ore[data-tip] { cursor: default; }
.lv { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.lvring { position: relative; width: 40px; height: 40px; }
.lvring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
.lvring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 15px; }
.lvmeta { line-height: 1.25; }
.lvmeta small { color: var(--dust); display: block; font-size: 11px; }
.clock { font-family: var(--display); font-weight: 700; font-size: 18px; min-width: 76px; text-align: right; }
.clock small { display: block; font: 500 10px var(--body); color: var(--dust); letter-spacing: .06em; }
.iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--seam); background: var(--rock); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { border-color: var(--dust); }

/* ── 캠프 ── */
.camp { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
.panel { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 12px 18px 0; border-bottom: 1px solid var(--seam); }
.tab { position: relative; background: none; border: 0; padding: 10px 18px 12px; margin-right: 6px; color: var(--dust); font-family: var(--display); font-weight: 700; font-size: 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--parch); border-color: var(--lamp); }
.tab:hover { color: var(--parch); }
.dot { position: absolute; top: 2px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ember); color: #fff; font: 700 11px/18px var(--body); text-align: center; }
.view { overflow: auto; min-height: 0; position: relative; }
.side { border-left: 1px solid var(--seam); background: var(--rock); display: flex; flex-direction: column; min-height: 0; }
.side-in { padding: 18px; display: flex; flex-direction: column; gap: 16px; overflow: auto; flex: 1; }
.go { margin: 0 18px 18px; padding: 16px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #ffbe5c, var(--lamp) 45%, #d9822a); color: #2a1606; font-family: var(--display); font-weight: 900; font-size: 22px; box-shadow: 0 6px 0 #7d4510, 0 10px 24px rgba(242,165,65,.25); transition: transform .08s, box-shadow .08s; }
.go small { display: block; font: 500 12px var(--body); opacity: .75; }
.go:hover { transform: translateY(-1px); }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #7d4510; }
h3 { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .08em; color: var(--dust); margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.kv span { color: var(--dust); }
.kv b { font-weight: 500; text-align: right; }
.pickcard { display: flex; gap: 12px; align-items: center; }
.pickcard svg { width: 54px; height: 54px; flex: none; }
.pickcard b { font-family: var(--display); font-size: 16px; display: block; }
.pickcard small { color: var(--dust); }
.minebox { border: 1px solid var(--seam); border-radius: 10px; padding: 10px 12px; background: var(--rock-2); font-size: 12px; color: var(--dust); }
.minebox b { color: var(--parch); }
.last { font-size: 13px; }
.last .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: 6px; background: var(--rock-2); font-size: 12px; }
.chip svg { width: 15px; height: 15px; }

/* 스킬 트리 — 가운데에서 나선으로 뻗는 생각 지도, 안 가 본 곳은 안개 */
.view.maptab { overflow: hidden; }
.mapwrap { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background: #1a1714; user-select: none; }
.mapwrap.drag { cursor: grabbing; }
.map { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.map > canvas, .map > .wires, .map > .drift { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.drift { background-repeat: repeat; animation: drift 90s linear infinite; opacity: .55; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
@keyframes drift { from { background-position: 0 0; } to { background-position: 1024px 512px; } }
.mn { position: absolute; width: 78px; height: 78px; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--tier, var(--seam)); background: radial-gradient(circle at 50% 30%, #2f2720, #17120f 75%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; transition: box-shadow .15s, filter .15s; }
.mn svg.ic { width: 28px; height: 28px; }
.mn .pips { display: flex; gap: 3px; }
.mn .pips i { width: 6px; height: 6px; border-radius: 50%; background: #3d3229; }
.mn .pips i.on { background: var(--lamp); }
.mn .lab { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--parch); text-shadow: 0 1px 4px #000, 0 0 8px #000; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.mn .lab .cost { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--dust); }
.mn .lab .cost svg { width: 12px; height: 12px; }
.mn.spine { width: 104px; height: 104px; border-width: 3px; background: radial-gradient(circle at 50% 30%, var(--tierRock, #3a2e24), #120e0b 80%); }
.mn.spine svg.ic { width: 36px; height: 36px; }
.mn.spine .lab { font-family: var(--display); font-size: 15px; }
.mn.own { box-shadow: 0 0 0 4px rgba(0,0,0,.4), 0 0 22px color-mix(in srgb, var(--tier) 35%, transparent); }
.mn.max { border-color: var(--lamp); }
.mn.front.open { filter: saturate(.55) brightness(.85); }
.mn.front.buy { border-color: var(--moss); animation: ready 1.6s ease-in-out infinite; }
.mn.front.buy .lab .cost { color: var(--moss); }
@keyframes ready { 0%, 100% { box-shadow: 0 0 0 3px rgba(155,209,127,.15), 0 0 12px rgba(155,209,127,.15); } 50% { box-shadow: 0 0 0 6px rgba(155,209,127,.22), 0 0 26px rgba(155,209,127,.3); } }
.mn.front.locked { filter: grayscale(.7) brightness(.7); }
.mn.mast { border-radius: 24px; width: 72px; height: 72px; background: radial-gradient(circle at 50% 30%, var(--tierRock, #2f2720), #120e0b 80%); }
.mn.mast svg.ic { width: 26px; height: 26px; }
.mn .mlv { font: 700 11px var(--body); color: var(--lamp); }
.mn.ghost { width: 56px; height: 56px; border: 2px dashed rgba(200,180,150,.35); background: rgba(30,25,21,.6); color: rgba(220,200,170,.5); font: 900 22px var(--display); cursor: default; }
.mn.ghost.spine { width: 76px; height: 76px; }
.mn:not(.ghost):hover { filter: brightness(1.2); }
.mn.flash { animation: flash .6s; }
.mn.reveal { animation: reveal .9s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(242,165,65,.9); } 100% { box-shadow: 0 0 0 30px rgba(242,165,65,0); } }
@keyframes reveal { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.mapctl { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; z-index: 3; }
.mapctl .iconbtn { font: 700 18px var(--body); }
.mapctl span { color: var(--dust); font-size: 12px; margin-left: 6px; text-shadow: 0 1px 4px #000; }
.maplegend { position: absolute; right: 16px; bottom: 16px; z-index: 3; display: flex; gap: 12px; font-size: 12px; color: var(--dust); background: rgba(12,10,9,.75); border: 1px solid var(--seam); border-radius: 10px; padding: 6px 10px; }
.maplegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 2px solid; }

.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 260px; background: #0b0908; border: 1px solid var(--seam); border-radius: 10px; padding: 10px 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.tip b { font-family: var(--display); font-size: 15px; display: block; margin-bottom: 2px; }
.tip .t-sub { color: var(--dust); font-size: 12px; }
.tip .t-cost { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.tip .t-cost span { display: inline-flex; align-items: center; gap: 3px; }
.tip .t-cost svg { width: 14px; height: 14px; }
.tip .short { color: var(--ember); }

/* 곡괭이 */
.grid-wrap { padding: 20px 22px 40px; }
.lead { color: var(--dust); margin: 0 0 16px; max-width: 62ch; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.pk { border: 1.5px solid var(--seam); border-radius: 14px; background: var(--rock); padding: 14px; display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; align-content: start; }
.pk svg.art { width: 64px; height: 64px; grid-row: span 2; }
.pk h4 { margin: 0; font-family: var(--display); font-size: 16px; }
.pk .st { font-size: 12px; color: var(--dust); }
.pk .fx { grid-column: 1 / -1; font-size: 12px; color: var(--lamp); min-height: 18px; }
.pk .need { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.pk .need span { display: inline-flex; align-items: center; gap: 3px; }
.pk .need svg { width: 14px; height: 14px; }
.pk .act { grid-column: 1 / -1; display: flex; gap: 6px; }
.pk.eq { border-color: var(--lamp); }
.pk.locked { opacity: .3; }
.btn { border: 1px solid var(--seam); background: var(--rock-2); border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: var(--dust); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.hot { background: var(--moss); color: #14210c; border-color: var(--moss); }
.btn.lamp { background: var(--lamp); color: #2a1606; border-color: var(--lamp); }

/* 재능 */
.offer { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 16px; margin: 6px 0 26px; }
.card { position: relative; border-radius: 16px; border: 2px solid var(--seam); background: linear-gradient(170deg, var(--rock-2), var(--rock)); padding: 20px 16px 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 200px; transition: transform .12s, border-color .12s; }
.card:hover { transform: translateY(-4px); border-color: var(--parch); }
.card .rar { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--dust); }
.card h4 { margin: 0; font-family: var(--display); font-size: 20px; }
.card p { margin: 0; font-size: 15px; }
.card .key { margin-top: auto; font-size: 11px; color: var(--dust); }
.card svg { width: 40px; height: 40px; }
.card.r1 { border-color: #5aa7e0; } .card.r1 .rar { color: #8cc8f2; }
.card.r2 { border-color: #e0a53d; background: linear-gradient(170deg, #3b2a12, var(--rock)); } .card.r2 .rar { color: var(--lamp); }
.owned { display: flex; flex-wrap: wrap; gap: 8px; }
.owned .chip { padding: 4px 10px; font-size: 13px; }

/* 랭킹 */
.rank-wrap { padding: 20px 22px 40px; max-width: 760px; }
.runbox { border: 1px solid var(--seam); border-radius: 14px; padding: 16px; background: var(--rock); margin-bottom: 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.runbox .big { font-family: var(--display); font-weight: 900; font-size: 28px; }
.runbox p { margin: 0; color: var(--dust); font-size: 13px; flex: 1; min-width: 220px; }
.board { width: 100%; border-collapse: collapse; font-size: 14px; }
.board th { text-align: left; font-weight: 500; color: var(--dust); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--seam); }
.board td { padding: 8px; border-bottom: 1px solid rgba(61,50,41,.5); }
.board td.pl { font-family: var(--display); font-weight: 900; width: 48px; }
.board tr.me td { background: rgba(242,165,65,.1); }
.board tr:nth-child(1) td.pl { color: #ffd36b; } .board tr:nth-child(2) td.pl { color: #d9e1ea; } .board tr:nth-child(3) td.pl { color: #e39a62; }
.muted { color: var(--dust); }
.namefm { display: flex; gap: 8px; flex-wrap: wrap; }
.namefm input { min-width: 0; flex: 1; max-width: 220px; height: 40px; border-radius: 9px; border: 1px solid var(--seam); background: var(--soot); color: var(--parch); padding: 0 12px; font: inherit; font-size: 16px; }

/* ── 채굴장 ── */
.mine { position: relative; min-height: 0; background: #0a0807; overflow: hidden; }
.mine canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }
.hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
.timer { min-width: 300px; text-align: center; }
.timer b { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.timer b.low { color: var(--ember); }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lamp); border-radius: 3px; }
.hud-left { position: absolute; left: 18px; top: 14px; font-size: 13px; color: var(--dust); pointer-events: none; text-shadow: 0 1px 6px #000; }
.hud-left b { display: block; font-family: var(--display); font-size: 24px; color: var(--parch); }
.hud-right { position: absolute; right: 18px; top: 14px; text-align: right; pointer-events: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.hud-right .chip { background: rgba(28,23,20,.8); }
.esc { position: absolute; right: 18px; bottom: 14px; font-size: 12px; color: var(--dust); }
.esc kbd, .go kbd, .btn kbd { font: 700 11px var(--body); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }

.result { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,6,5,.55); backdrop-filter: blur(3px); }
.rc { width: min(460px, calc(100% - 32px)); background: var(--rock); border: 1px solid var(--seam); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.rc h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 900; font-size: 26px; }
.rc .score { font-family: var(--display); font-weight: 900; font-size: 44px; color: var(--lamp); line-height: 1.1; }
.rc .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.rc .row { display: flex; gap: 8px; margin-top: 16px; }
.rc .row .btn { flex: 1; padding: 12px; font-size: 15px; }
.newbest { display: inline-block; font-size: 12px; font-weight: 700; color: #2a1606; background: var(--lamp); border-radius: 6px; padding: 1px 8px; vertical-align: middle; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #0b0908; border: 1px solid var(--seam); border-radius: 12px; padding: 10px 16px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.6); max-width: calc(100% - 32px); animation: rise .2s ease-out; }

.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(8,6,5,.6); padding: 16px; }
.modal .rc { max-height: calc(100% - 32px); overflow: auto; }
.modal textarea { width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--seam); background: var(--soot); color: var(--parch); padding: 10px; font: inherit; resize: vertical; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { text-align: left; padding: 12px 14px; font-size: 15px; }
.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg .btn[aria-pressed="true"] { background: var(--parch); color: var(--soot); }

.clear { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(255,90,60,.25), rgba(8,6,5,.85) 60%); }
.clear .rc { text-align: center; border-color: var(--lamp-deep); }
.clear .rc h2 { font-size: 30px; color: var(--lamp); }
.clear .t { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: 1.1; margin: 8px 0; }

.narrow { display: none; }
@media (max-width: 760px) {
  .narrow:not(.dismissed) { display: grid; position: fixed; inset: 0; z-index: 80; place-items: center; background: var(--soot); text-align: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .narrow h2 { font-family: var(--display); font-size: 26px; margin: 12px 0 6px; color: var(--lamp); }
  .narrow p { color: var(--dust); max-width: 32ch; margin: 0 auto 18px; }
  .camp { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .side { border-left: 0; border-top: 1px solid var(--seam); max-height: 40vh; }
  .bag, .lvmeta, .clock small { display: none; }
  .top { gap: 10px; padding-inline: 12px; }
  .clock { min-width: 0; font-size: 15px; }
  .brand { font-size: 18px; }
  .offer { grid-template-columns: 1fr; }
}
/* 테스트 모드 — 공사장 줄무늬 */
.brand { cursor: default; }
.brand.spin svg { animation: spin .6s ease-out; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(720deg); } }
.testbadge { font: 900 12px var(--body); letter-spacing: .04em; padding: 4px; border-radius: 8px; border: 0; background: repeating-linear-gradient(-45deg, #ffcf3a 0 8px, #1a1406 8px 16px); white-space: nowrap; }
.testbadge span { display: block; background: #1a1406; color: #ffcf3a; padding: 3px 8px; border-radius: 5px; }
.testpanel { position: fixed; left: 16px; top: 130px; z-index: 45; width: 300px; max-height: calc(100% - 146px); overflow: auto; background: #0e0c0a; border: 2px solid #ffcf3a; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.6); font-size: 13px; }
.testpanel header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: repeating-linear-gradient(-45deg, #2a2208 0 12px, #1a1406 12px 24px); border-bottom: 1px solid #5a4a14; cursor: move; user-select: none; }
.testpanel header b { font-family: var(--display); font-size: 16px; color: #ffcf3a; flex: 1; }
.testpanel header button { border: 1px solid #5a4a14; background: #0e0c0a; border-radius: 7px; padding: 3px 9px; font-size: 12px; }

<script>
'use strict';
const SERVER = '__SERVER_URL__';
const PAGES_URL = 'https://2juwon.github.io/mining/';
const SAVE_KEY = 'hanpan-mine-v1';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const T = MG.TIERS;

// ── 그림 조각 (SVG) ──────────────────────────────
function oreSvg(t) {
  const c = T[t];
  return `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7 4.2v8.6l-7 4.2-7-4.2V5.7z" fill="${c.rock}" stroke="#000" stroke-opacity=".5"/><path d="M10 4.5l4.3 2.6v5.8L10 15.5l-4.3-2.6V7.1z" fill="${c.vein}"/><path d="M10 4.5l4.3 2.6L10 9.7 5.7 7.1z" fill="#fff" fill-opacity=".35"/></svg>`;
}
const gemSvg = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10l4 5-9 10L1 8z" fill="#e8508a"/><path d="M5 3h10l4 5H1z" fill="#ff8fbd"/><path d="M7 8l3 10 3-10z" fill="#fff" fill-opacity=".25"/></svg>`;
const ICON = {
  dmg: '<path d="M4 9c5-4 11-4 16 0" stroke="#c9cfd6" stroke-width="2.4"/><path d="M12 7v14" stroke="#b07a46" stroke-width="2.6"/>',
  spd: '<path d="M3 8h11M5 12h13M3 16h9" stroke="#8fe0ff" stroke-width="2.2"/><path d="M17 5l4 3-4 3" stroke="#8fe0ff" stroke-width="2"/>',
  rad: '<circle cx="12" cy="12" r="8.5" stroke="#f2a541" stroke-width="2" stroke-dasharray="3 2.5"/><circle cx="12" cy="12" r="2.5" fill="#f2a541"/>',
  time: '<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9" stroke="#f1e6d2" stroke-width="1.8"/><path d="M10 18h4" stroke="#f2a541" stroke-width="2.4"/>',
  rocks: '<path d="M3 19l3-6 4 1 2 5z" fill="#8a837a"/><path d="M10 19l2-8 5-2 4 10z" fill="#6f6a64"/><path d="M6 11l2-5 4 1-1 4z" fill="#a39b90"/>',
  spawn: '<path d="M12 21V11" stroke="#9bd17f" stroke-width="2.2"/><path d="M12 13c-5 0-7-3-7-7 5 0 7 3 7 7zM12 11c0-4 2-7 7-7 0 4-2 7-7 7z" fill="#9bd17f"/>',
  ore: '<path d="M12 3l7 4.5v9L12 21l-7-4.5v-9z" fill="#ffc94a"/><path d="M12 3l7 4.5L12 12 5 7.5z" fill="#ffe39a"/>',
  crit: '<path d="M12 2l2.6 6.5L21 9l-5 4.4L17.6 21 12 17l-5.6 4L8 13.4 3 9l6.4-.5z" fill="#ff6a3d"/>',
  critD: '<rect x="5" y="4" width="14" height="7" rx="1.5" fill="#c9cfd6"/><path d="M12 11v10" stroke="#b07a46" stroke-width="2.8"/>',
  gem: '<path d="M6 4h12l4 6-10 11L2 10z" fill="#e8508a"/><path d="M6 4h12l4 6H2z" fill="#ff8fbd"/>',
  xp: '<path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-7v15a2 2 0 0 1 2-2h5z" fill="#d8c3a0"/><path d="M13 7v13" stroke="#6b5640" stroke-width="1.4"/>',
  chain: '<path d="M14 2L5 13h6l-2 9 10-12h-6l2-8z" fill="#9fd8ff" stroke="#e6f6ff" stroke-width=".8"/>',
  boom: '<circle cx="11" cy="14" r="7" fill="#3b3330"/><path d="M15 8l3-3" stroke="#b07a46" stroke-width="2"/><path d="M19 3l1.5 1.5M21 6h-2M17 2v2" stroke="#ff9a3d" stroke-width="1.6"/><circle cx="8.5" cy="11.5" r="2" fill="#fff" fill-opacity=".2"/>',
  sand: '<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9" stroke="#e6cf8a" stroke-width="1.8"/><circle cx="19" cy="5" r="2" fill="#fff3b0"/>',
  luck: '<path d="M12 2l3 7h-6zM9 9h6v4a3 3 0 0 1-6 0z" fill="#f2a541"/><circle cx="12" cy="12" r="6" fill="#f2a541" fill-opacity=".2"/><path d="M12 16v6M9 22h6" stroke="#8a6a44" stroke-width="2"/>',
  mine: '<path d="M3 9h18l-2 8H5z" fill="#7a5a3c"/><path d="M6 9l2-4 4 2 3-3 3 5" fill="#ffc94a"/><circle cx="8" cy="19" r="2" fill="#c9cfd6"/><circle cx="16" cy="19" r="2" fill="#c9cfd6"/>',
  depth: '<path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8" stroke="#c9a77a" stroke-width="2"/>',
  heart: '<path d="M12 21l-8-8a5 5 0 0 1 8-6 5 5 0 0 1 8 6z" fill="#ff4f5e"/><path d="M12 9l3 4-3 5-3-5z" fill="#ffd0a0"/>',
};
const icon = (k, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ''}</svg>`;
function pickSvg(p, size) {
  const i = MG.PICKS.indexOf(p);
  const head = i === 0 ? '#9c7a55' : T[Math.max(0, i - 1)].vein;
  const dark = i === 0 ? '#5c4630' : T[Math.max(0, i - 1)].rock;
  return `<svg class="art" viewBox="0 0 64 64" aria-hidden="true"><path d="M33 22L18 56" stroke="#3a2614" stroke-width="7" stroke-linecap="round"/><path d="M33 22L18 56" stroke="#9a6a3d" stroke-width="4.5" stroke-linecap="round"/><path d="M8 20C20 6 44 4 58 16L50 20C42 14 26 13 14 23z" fill="${head}" stroke="${dark}" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 18C24 10 40 9 50 14" stroke="#fff" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="28" y="14" width="10" height="9" rx="2" transform="rotate(20 33 18)" fill="${dark}"/></svg>`;
}
const costHtml = (cost, s) => Object.keys(cost).map((t) => `<span class="${s && s.ores[t] < cost[t] ? 'short' : ''}">${oreSvg(+t)}${MG.fmt(cost[t])}</span>`).join('');

// ── 저장 ─────────────────────────────────────────
let S = null;
// 테스트 모드: 진짜 저장과 따로 노는 연습판 (랭킹에 안 올라감)
const TEST = { on: false, speed: 1, oneHit: false, endless: false, noFog: false };
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return MG.fix(JSON.parse(raw)); } catch (e) { /* 저장 안 됨 */ }
  return null;
}
function save() {
  if (!S) return;
  S.lastSeen = Date.now();
  try { localStorage.setItem(TEST.on ? SAVE_KEY + ':test' : SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 안 됨 */ }
}
let prefs = { sound: true };
try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(SAVE_KEY + ':prefs') || '{}')); } catch (e) { /* 기본값 */ }
const savePrefs = () => { try { localStorage.setItem(SAVE_KEY + ':prefs', JSON.stringify(prefs)); } catch (e) { /* 저장 안 됨 */ } };

// ── 서버 ─────────────────────────────────────────
async function api(path, body) {
  if (!SERVER) throw new Error('서버 없음');
  const r = await fetch(SERVER + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = '서버에 연결하지 못했어요';
  return j;
}
async function startRun() {
  if (!SERVER || TEST.on) return;
  try {
    const r = await api('/api/run/start', {});
    if (r.run) { S.run = { id: r.run, token: r.token, at: r.at }; S.startAt = Date.now(); save(); }
    else S.runError = r.error;
  } catch (e) { S.runError = '서버에 연결하지 못했어요'; }
  if (tab === 'rank') renderView();
}
async function reportClear() {
  if (TEST.on || !S.run || S.runResult && S.runResult.ms) return;
  try {
    const r = await api('/api/run/clear', { run: S.run.id, token: S.run.token, sessions: S.sessions, level: S.level, broken: S.broken, clientMs: (S.clearAt || Date.now()) - S.startAt });
    S.runResult = r.error ? { error: r.error, ms: r.ms } : { ms: r.ms, place: r.place, named: r.named };
  } catch (e) { S.runResult = { error: '서버에 연결하지 못했어요. 랭킹 탭에서 다시 보낼 수 있어요', retry: true }; }
  save();
}

// ── 소리 (WebAudio로 직접 만듦) ───────────────────
let AC = null, master = null;
function audio() {
  if (!prefs.sound) return null;
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
let noiseBuf = null;
function noise(ac) {
  if (noiseBuf) return noiseBuf;
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
const lastSnd = {};
function sfx(kind, x) {
  const ac = audio(); if (!ac) return;
  const now = ac.currentTime;
  if (lastSnd[kind] && now - lastSnd[kind] < (kind === 'hit' ? 0.03 : 0.05)) return;
  lastSnd[kind] = now;
  const env = (g, a, d, peak) => { g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(peak, now + a); g.gain.exponentialRampToValueAtTime(0.0001, now + a + d); };
  if (kind === 'hit' || kind === 'crit') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = (kind === 'crit' ? 1500 : 900) + (x || 0) * 70 + Math.random() * 80;
    env(g, 0.002, kind === 'crit' ? 0.18 : 0.08, kind === 'crit' ? 0.5 : 0.25);
    o.connect(g).connect(master); o.start(now); o.stop(now + 0.25);
  } else if (kind === 'break' || kind === 'boom') {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = noise(ac); f.type = 'lowpass'; f.frequency.value = kind === 'boom' ? 500 : 1400 + (x || 0) * 120;
    env(g, 0.004, kind === 'boom' ? 0.45 : 0.16, kind === 'boom' ? 0.9 : 0.45);
    n.connect(f).connect(g).connect(master); n.start(now); n.stop(now + 0.5);
  } else if (kind === 'zap') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(2400, now); o.frequency.exponentialRampToValueAtTime(300, now + 0.12);
    env(g, 0.002, 0.12, 0.12); o.connect(g).connect(master); o.start(now); o.stop(now + 0.2);
  } else {
    const notes = { up: [523, 659, 784, 1047], buy: [784, 1175], end: [392, 523, 659], tick: [1200], clear: [523, 659, 784, 1047, 1319, 1568], gem: [1319, 1760], start: [330, 494] }[kind] || [600];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = now + i * (kind === 'clear' ? 0.11 : 0.07);
      o.type = kind === 'tick' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(kind === 'tick' ? 0.08 : 0.3, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 'clear' ? 0.5 : 0.22));
      o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.6);
    });
  }
}
function drawSoundBtn() {
  $('#soundBtn').innerHTML = prefs.sound
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}

// ── 위 띠 ────────────────────────────────────────
let bagEls = [];
function buildBag() {
  const bag = $('#bag'); bag.innerHTML = ''; bagEls = [];
  T.forEach((c, t) => { const e = el('div', 'ore num'); e.title = c.name; bag.append(e); bagEls.push(e); });
  const g = el('div', 'ore num'); g.title = '보석 — 곡괭이 강화에 써요'; bag.append(g); bagEls.push(g);
}
const shown = { ores: [], gems: -1 };
function drawTop() {
  const d = MG.depthOf(S);
  T.forEach((c, t) => {
    const e = bagEls[t], lock = t > d && !S.total[t];
    const v = S.ores[t];
    if (shown.ores[t] !== v || e.dataset.lock !== String(lock)) {
      if (shown.ores[t] != null && v > shown.ores[t]) { e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 140); }
      e.innerHTML = lock ? `${oreSvg(t)}<b>?</b>` : `${oreSvg(t)}<b>${MG.fmt(v)}</b>`;
      e.classList.toggle('lock', lock); e.dataset.lock = String(lock); shown.ores[t] = v;
    }
  });
  if (shown.gems !== S.gems) { bagEls[T.length].innerHTML = `${gemSvg}<b>${MG.fmt(S.gems)}</b>`; shown.gems = S.gems; }
  $('#lvNum').textContent = S.level;
  const need = MG.xpNeed(S.level);
  $('#xpTxt').textContent = `${MG.fmt(S.xp)} / ${MG.fmt(need)}`;
  $('#xpArc').setAttribute('stroke-dashoffset', String(107 * (1 - Math.min(1, S.xp / need))));
  drawClock();
}
function runMs() { return S.cleared ? (S.runResult && S.runResult.ms) || (S.clearAt - S.startAt) : Date.now() - S.startAt; }
function drawClock() { $('#clock').innerHTML = `${MG.fmtTime(runMs())}<small>${S.cleared ? '클리어 기록' : '걸린 시간'}</small>`; }

// ── 캠프 화면 ────────────────────────────────────
let tab = 'tree';
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 16, top = y + 16;
  if (left + r.width > innerWidth - 8) left = x - r.width - 16;
  if (top + r.height > innerHeight - 8) top = y - r.height - 16;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
const hideTip = () => { tip.hidden = true; };

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  hideTip();
  renderView();
  $('#view').scrollTop = 0;
}
function drawDots() {
  const tb = document.querySelector('[data-tab="talent"]');
  let d = tb.querySelector('.dot');
  if (S.pts > 0) { if (!d) { d = el('span', 'dot'); tb.append(d); } d.textContent = S.pts; } else if (d) d.remove();
  const tt = document.querySelector('[data-tab="tree"]');
  const can = MG.NODES.some((n) => MG.nodeState(S, n.id) === 'buy');
  let d2 = tt.querySelector('.dot');
  if (can) { if (!d2) { d2 = el('span', 'dot'); tt.append(d2); } d2.textContent = '!'; } else if (d2) d2.remove();
  const pt = document.querySelector('[data-tab="picks"]');
  const canP = MG.PICKS.some((p) => MG.pickState(S, p.id) === 'buy');
  let d3 = pt.querySelector('.dot');
  if (canP) { if (!d3) { d3 = el('span', 'dot'); pt.append(d3); } d3.textContent = '!'; } else if (d3) d3.remove();
}
function renderView() {
  const v = $('#view');
  v.classList.remove('maptab');
  if (tab === 'tree') renderTree(v);
  else if (tab === 'picks') renderPicks(v);
  else if (tab === 'talent') renderTalent(v);
  else renderRank(v);
  drawDots();
}
function refresh() { drawTop(); renderSide(); renderView(); }

// 스킬 트리 지도 — 가운데에서 나선으로 깊어짐. 가 본 곳 둘레만 안개가 걷힘
const MAPS = 1.35, MAPPAD = 340;
const MB = (() => {
  const xs = MG.NODES.map((n) => n.x * MAPS), ys = MG.NODES.map((n) => n.y * MAPS);
  const minX = Math.min(...xs) - MAPPAD, minY = Math.min(...ys) - MAPPAD;
  return { minX, minY, w: Math.max(...xs) + MAPPAD - minX, h: Math.max(...ys) + MAPPAD - minY };
})();
const mp = (n) => ({ x: n.x * MAPS - MB.minX, y: n.y * MAPS - MB.minY });
const tierOf = (n) => (n.k === 'heart' ? { rock: '#5a1420', vein: '#ff4f5e', name: '심장' } : T[n.col === 0 ? n.row : n.row]);
function visOf(n) {

// ── 채굴장 ───────────────────────────────────────
const cv = $('#cv'), cx = cv.getContext('2d');
let sess = null, mouse = null, view = { s: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let fx = [], shake = 0, bgCanvas = null, lastResult = null, swingFx = [], rockCache = new Map();
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const s = Math.min(r.width / MG.W, (r.height - 70) / MG.H);
  view = { s, ox: (r.width - MG.W * s) / 2, oy: 70 + (r.height - 70 - MG.H * s) / 2, w: r.width, h: r.height, dpr };
  bgCanvas = null;
}
function toField(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left - view.ox) / view.s, y = (e.clientY - r.top - view.oy) / view.s;
  return { x, y, sx: e.clientX - r.left, sy: e.clientY - r.top };
}
cv.addEventListener('mousemove', (e) => { mouse = toField(e); });
cv.addEventListener('mouseleave', () => { mouse = null; });

// 배경: 갱도 벽 (한 번 그려 두고 재사용)
function makeBg() {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d'), w = c.width, h = c.height, d = view.dpr;
  const r = MG.rng(7);
  g.fillStyle = '#0d0a08'; g.fillRect(0, 0, w, h);
  // 바위 결
  for (let i = 0; i < 220; i++) {
    const x = r() * w, y = r() * h, s = (20 + r() * 90) * d;
    g.fillStyle = `rgba(${40 + r() * 30},${32 + r() * 22},${26 + r() * 18},${0.25 + r() * 0.35})`;
    g.beginPath();
    for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2, rr = s * (0.5 + r() * 0.5); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.6); }
    g.fill();
  }
  // 바닥 (채굴장)
  const fx0 = view.ox * d, fy0 = view.oy * d, fw = MG.W * view.s * d, fh = MG.H * view.s * d;
  const fg = g.createRadialGradient(fx0 + fw / 2, fy0 + fh / 2, fh * 0.1, fx0 + fw / 2, fy0 + fh / 2, fw * 0.62);
  fg.addColorStop(0, '#3a2e24'); fg.addColorStop(0.7, '#241b15'); fg.addColorStop(1, 'rgba(20,15,12,0)');
  g.fillStyle = fg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    const x = fx0 + r() * fw, y = fy0 + r() * fh;
    g.fillStyle = `rgba(${150 + r() * 60},${120 + r() * 50},${90 + r() * 40},${0.04 + r() * 0.06})`;
    g.fillRect(x, y, (1 + r() * 3) * d, (1 + r() * 2) * d);
  }
  // 반짝이는 광물 조각
  for (let i = 0; i < 60; i++) {
    const x = r() * w, y = r() * h, t = Math.floor(r() * 10);
    g.fillStyle = T[t].vein; g.globalAlpha = 0.15 + r() * 0.25;
    g.fillRect(x, y, 2 * d, 2 * d);
  }
  g.globalAlpha = 1;
  // 버팀목
  const beam = (x) => {
    g.fillStyle = '#3b2716'; g.fillRect(x, 0, 22 * d, h);
    g.fillStyle = 'rgba(255,200,140,.06)'; g.fillRect(x + 3 * d, 0, 4 * d, h);
  };
  beam(fx0 - 46 * d); beam(fx0 + fw + 24 * d);
  g.fillStyle = '#3b2716'; g.fillRect(fx0 - 46 * d, fy0 - 40 * d, fw + 92 * d, 18 * d);
  // 가장자리 어둡게
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
  return c;
}
// 바위 모양 (바위마다 한 번 그려 둠)
function rockSprite(k) {
  let sp = rockCache.get(k.id);
  if (sp) return sp;
  const T0 = T[k.tier], size = Math.ceil(k.r * 2.6), d = view.dpr * view.s;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * d);
  const g = c.getContext('2d');
  g.scale(d, d); g.translate(size / 2, size / 2);
  const r = MG.rng(k.seed || k.id);
  const n = 8 + Math.floor(r() * 4), pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + r() * 0.3, rr = k.r * (0.82 + r() * 0.3); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.92]); }
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  const gr = g.createLinearGradient(-k.r, -k.r, k.r, k.r);
  gr.addColorStop(0, shade(T0.rock, 35)); gr.addColorStop(0.55, T0.rock); gr.addColorStop(1, shade(T0.rock, -30));
  g.fillStyle = gr; g.fill();
  g.lineWidth = 2; g.strokeStyle = 'rgba(0,0,0,.55)'; g.stroke();
  g.save(); g.clip();
  // 면
  g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(pts[i * 2 % n][0] * 0.3, pts[i * 2 % n][1] * 0.3); g.lineTo(pts[(i * 3 + 1) % n][0], pts[(i * 3 + 1) % n][1]); g.stroke(); }
  // 광맥
  const vc = k.tier === 0 ? 3 : 4 + Math.floor(r() * 3);
  for (let i = 0; i < vc; i++) {
    const a = r() * Math.PI * 2, dd = r() * k.r * 0.6, x = Math.cos(a) * dd, y = Math.sin(a) * dd, s = k.r * (0.12 + r() * 0.16);
    g.fillStyle = T0.vein; g.globalAlpha = k.tier === 0 ? 0.25 : 0.95;
    g.beginPath(); for (let j = 0; j < 5; j++) { const b = (j / 5) * Math.PI * 2 + r(); g.lineTo(x + Math.cos(b) * s, y + Math.sin(b) * s); } g.fill();
    g.globalAlpha = k.tier === 0 ? 0.15 : 0.7; g.fillStyle = '#fff'; g.fillRect(x - s * 0.3, y - s * 0.4, s * 0.35, s * 0.25);
  }
  g.globalAlpha = 1;
  const hl = g.createRadialGradient(-k.r * 0.4, -k.r * 0.5, 1, -k.r * 0.4, -k.r * 0.5, k.r);
  hl.addColorStop(0, 'rgba(255,240,220,.22)'); hl.addColorStop(1, 'rgba(255,240,220,0)');
  g.fillStyle = hl; g.fillRect(-k.r * 2, -k.r * 2, k.r * 4, k.r * 4);
  g.restore();
  // 금 가는 선 (미리 정해 둠)
  const cracks = [];
  for (let i = 0; i < 6; i++) {
    const a = r() * Math.PI * 2, line = [[Math.cos(a) * k.r * 0.15, Math.sin(a) * k.r * 0.15]];
    let x = line[0][0], y = line[0][1];
    for (let j = 0; j < 3; j++) { const b = a + (r() - 0.5) * 1.1; x += Math.cos(b) * k.r * 0.28; y += Math.sin(b) * k.r * 0.28; line.push([x, y]); }
    cracks.push(line);
  }
  sp = { c, size, cracks };
  rockCache.set(k.id, sp);
  return sp;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, v + amt));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

let rafOn = false, lastTick = 0, tickSec = 0;
function frame(now) {

  let dt = Math.min(0.05, (now - lastTick) / 1000) * (TEST.on ? TEST.speed : 1);
  lastTick = now;
  if (!sess.over) {
    // 정해진 간격으로 나눠서 진행
    while (dt > 0) {
      const d = Math.min(1 / 60, dt); dt -= d;
      const cur = mouse && mouse.x >= -20 && mouse.y >= -20 && mouse.x <= MG.W + 20 && mouse.y <= MG.H + 20 ? mouse : null;
      const wasCleared = S.cleared;
      MG.step(S, sess, d, cur);
      handleEvents();
      if (!wasCleared && S.cleared) { sess.clearedNow = true; sess.over = true; shake = 28; }
      if (sess.over) break;
    }
    const sec = Math.ceil(sess.timeLeft);
    if (sec !== tickSec) { tickSec = sec; if (sec <= 3 && sec > 0) sfx('tick'); }
    if (sess.over && !sess.ending) { const me = sess; me.ending = true; setTimeout(() => { if (sess === me) endSessionNow(false); }, me.clearedNow ? 1200 : 450); }

}

function handleEvents() {

    hudShown = key;
    $('#hudL').innerHTML = `점수<b>${MG.fmt(sess.score)}</b>`;
    $('#hudR').innerHTML = sess.gain.map((n, t) => (n ? `<span class="chip num">${oreSvg(t)}+${MG.fmt(n)}</span>` : '')).join('') + (sess.gems ? `<span class="chip num">${gemSvg}+${sess.gems}</span>` : '');
  }
}

// ── 알림·메뉴 ────────────────────────────────────
let toastT = 0;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = el('div', 'toast', esc(msg)); document.body.append(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800);
}
function modal(html) {
  const m = el('div', 'modal'); m.innerHTML = `<div class="rc">${html}</div>`;
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  document.body.append(m);
  return m;
}
function openMenu() {
  const m = modal(`<h2>메뉴</h2><div class="menu-list" style="margin-top:12px">
    <button class="btn" id="mHelp">게임 방법</button>
    ${SERVER ? '<button class="btn" id="mFeed">의견 보내기</button>' : ''}
    <button class="btn" id="mReset">처음부터 다시 하기</button>
    <button class="btn" id="mClose">닫기</button></div>`);
  $('#mClose', m).onclick = () => m.remove();
  $('#mHelp', m).onclick = () => { m.remove(); openHelp(); };
  if (SERVER) $('#mFeed', m).onclick = () => { m.remove(); openFeedback(); };
  const r = $('#mReset', m);
  r.onclick = () => {
    if (r.dataset.sure !== '1') { r.dataset.sure = '1'; r.textContent = '모든 광석·스킬·카드가 지워져요. 한 번 더 누르면 처음부터'; r.style.borderColor = 'var(--ember)'; return; }
    m.remove(); newGame(true);
  };
}
function openHelp() {
  const m = modal(`<h2>게임 방법</h2><div style="font-size:14px;display:flex;flex-direction:column;gap:8px;margin-top:10px">
    <p style="margin:0"><b>채굴</b> — 채굴을 시작하면 바위가 솟아나요. 마우스를 바위 위에 올려 두면 고리 안의 바위를 곡괭이가 저절로 캐요. 클릭할 필요는 없어요.</p>
    <p style="margin:0"><b>스킬 트리</b> — 캔 광석으로 능력을 올려요. 가운데 기둥을 열면 더 깊은 광석이 나와요. 한 층 더 내려가면 지난 광석의 「숙련」이 열려서, 남는 광석으로 공격력을 끝없이 올릴 수 있어요.</p>
    <p style="margin:0"><b>곡괭이</b> — 새 광석으로 더 센 곡괭이를 만들어요. 보석으로 강화할 수 있어요.</p>
    <p style="margin:0"><b>재능</b> — 레벨이 오를 때마다 카드 셋 중 하나를 골라요. 대신 바위가 조금씩 단단해져요.</p>
    <p style="margin:0"><b>목표</b> — 가장 깊은 곳의 「광산의 심장」을 깨면 클리어! 새 게임부터 깰 때까지의 시간으로 랭킹이 매겨져요.</p>
    <p style="margin:0" class="muted">단축키: Space 채굴 시작·다시 캐기 · Esc 그만 캐기·캠프로 · 1~3 재능 카드 고르기 · M 소리</p></div>
    <div class="row"><button class="btn lamp" id="hOk">알겠어요</button></div>`);
  $('#hOk', m).onclick = () => m.remove();
}
function openFeedback() {
  let kind = 'idea';
  const m = modal(`<h2>의견 보내기</h2><div class="seg" style="margin-top:10px"><button class="btn" data-k="idea" aria-pressed="true">의견</button><button class="btn" data-k="bug" aria-pressed="false">고장 신고</button></div>
    <textarea id="fbText" maxlength="2000" placeholder="좋았던 점, 바라는 점, 이상한 점을 적어 주세요"></textarea>
    <p class="muted" style="font-size:12px;margin:6px 0 0">고장 신고에는 지금 게임 상태(광석·스킬)가 같이 가요.</p>
    <div class="row"><button class="btn" id="fbNo">닫기</button><button class="btn lamp" id="fbGo">보내기</button></div>`);
  m.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { kind = b.dataset.k; m.querySelectorAll('[data-k]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  $('#fbNo', m).onclick = () => m.remove();
  $('#fbGo', m).onclick = async () => {
    const text = $('#fbText', m).value.trim();
    if (!text) { toast('내용을 적어 주세요'); return; }
    const ctx = kind === 'bug' ? { state: { ...S, run: S.run ? { id: S.run.id } : null } } : null;
    const r = await api('/api/feedback', { kind, text, context: ctx }).catch(() => ({ error: '서버에 연결하지 못했어요' }));
    if (r.error) { toast(r.error); return; }
    m.remove(); toast('보냈어요. 고마워요!');
  };
}

function newGame(ranked) {
  S = MG.newState(Date.now());
  lastResult = null; boardCache = null; cam = null; fogR = {}; seenFront = null;
  save();
  if (ranked) startRun().then(() => { save(); if (SERVER) loadBoard(); });
  setTab('tree'); refresh();
}

// ── 테스트 모드 (이스터 에그: 왼쪽 위 '한판 광산'을 빠르게 7번 누르기) ──
let eggN = 0, eggT = 0;
$('.brand').addEventListener('click', () => {
  const now = Date.now();
  eggN = now - eggT < 700 ? eggN + 1 : 1;
  eggT = now;
  const b = $('.brand'); b.classList.remove('spin'); void b.offsetWidth;
  if (eggN >= 3 && eggN < 7) toast(TEST.on ? `테스트 모드를 닫기까지 ${7 - eggN}번` : `곡괭이가 흔들려요… ${7 - eggN}번 더`);
  if (eggN >= 7) { eggN = 0; b.classList.add('spin'); if (TEST.on) exitTest(); else enterTest(); }
});
function enterTest() {
  if (sess) { toast('채굴이 끝난 뒤에 열 수 있어요'); return; }
  save(); // 진짜 게임 저장
  let t = null;
  try { const raw = localStorage.getItem(SAVE_KEY + ':test'); if (raw) t = MG.fix(JSON.parse(raw)); } catch (e) { /* 없음 */ }
  TEST.on = true;
  S = t || testCopy();
  resetMapView();
  sfx('clear');
  toast('테스트 모드가 열렸어요. 진짜 게임과 따로 저장되고 랭킹에는 안 올라가요');
  drawTest(); refresh();
}
function testCopy() {
  let real = null;
  try { real = MG.fix(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) { real = null; }
  const t = JSON.parse(JSON.stringify(real || S));
  t.run = null; t.runResult = null; t.runError = null;
  return t;
}
function exitTest() {
  if (sess) { toast('채굴이 끝난 뒤에 닫을 수 있어요'); return; }
  save();
  TEST.on = false; TEST.speed = 1; TEST.oneHit = TEST.endless = TEST.noFog = false;
  S = load() || MG.newState(Date.now());
  shown.ores = []; shown.gems = -1; lastResult = null;
  resetMapView();
  toast('진짜 게임으로 돌아왔어요');
  drawTest(); refresh();
}
function resetMapView() { cam = null; fogR = {}; seenFront = null; shown.ores = []; shown.gems = -1; }
function testDo(what) {
  const all = () => MG.TIERS.map((_, t) => t);
  switch (what) {
    case 'ore': all().forEach((t) => { S.ores[t] += 1000; S.total[t] += 1000; }); break;
    case 'ore10': all().forEach((t) => { S.ores[t] = Math.max(1000, S.ores[t]) * 10; }); break;
    case 'gem': S.gems += 50; break;
    case 'depth': { const d = MG.depthOf(S); if (d < 9) { S.skills['d' + (d + 1)] = 1; } else if (!S.heartOpen) { S.skills.heart = 1; S.heartOpen = true; } break; }
    case 'depthAll': for (let t = 0; t < 10; t++) S.skills['d' + t] = 1; break;
    case 'skills': for (const n of MG.NODES) if (n.k !== 'heart') S.skills[n.id] = n.max === Infinity ? Math.max(20, MG.lvOf(S, n.id)) : n.max; break;
    case 'picks': { const d = MG.depthOf(S); MG.PICKS.forEach((p) => { const mt = Math.max(0, ...Object.keys(p.cost).map(Number)); if (mt <= d && !S.picks.own.includes(p.id)) S.picks.own.push(p.id); }); S.picks.eq = S.picks.own[S.picks.own.length - 1]; break; }
    case 'level': MG.addXp(S, MG.xpNeed(S.level) - S.xp); break;
    case 'heart': S.skills.heart = 1; S.heartOpen = true; S.cleared = false; S.heartHp = Math.min(S.heartHp, 1000); break;
    case 'heartFull': S.heartHp = MG.HEART.hp; S.cleared = false; S.clearAt = null; break;
    case 'idle': { const got = MG.idle(S, 3600); toast('자동 광산 1시간: ' + (got.map((n, t) => (n ? `${T[t].name} ${MG.fmt(n)}` : '')).filter(Boolean).join(', ') || '없음 (자동 광산을 먼저 여세요)')); break; }
    case 'copy': S = testCopy(); resetMapView(); toast('진짜 게임 상태를 다시 가져왔어요'); break;
    case 'fresh': S = MG.newState(Date.now()); resetMapView(); toast('테스트판을 처음부터 시작해요'); break;
  }
  save(); refresh(); drawTest();
}
let tpPos = null;
function drawTest() {
  $('#testBadge').hidden = !TEST.on;
  let p = $('#testPanel');
  if (!TEST.on) { if (p) p.remove(); return; }
  const min = p && p.classList.contains('min');
  if (!p) { p = el('section', 'testpanel'); p.id = 'testPanel'; document.body.append(p); }
  const tg = (k, label) => `<button class="btn" data-tg="${k}" aria-pressed="${!!TEST[k]}">${label}</button>`;
  p.innerHTML = `<header><b>테스트 모드</b><button data-a="min">${min ? '펼치기' : '접기'}</button><button data-a="exit">나가기</button></header>
  <div class="tp-body">
    <div><h4>광석·보석</h4><div class="tp-row"><button class="btn" data-do="ore">모든 광석 +1000</button><button class="btn" data-do="ore10">×10</button><button class="btn" data-do="gem">보석 +50</button><button class="btn" data-do="idle">자동 광산 1시간</button></div></div>
    <div><h4>진행</h4><div class="tp-row"><button class="btn" data-do="depth">다음 광맥 열기</button><button class="btn" data-do="depthAll">광맥 모두</button><button class="btn" data-do="skills">스킬 모두 최대</button><button class="btn" data-do="picks">곡괭이 모두</button><button class="btn" data-do="level">레벨 +1</button></div></div>
    <div><h4>광산의 심장</h4><div class="tp-row"><button class="btn" data-do="heart">체력 1000으로</button><button class="btn" data-do="heartFull">처음 체력으로</button></div></div>
    <div><h4>채굴</h4><div class="tp-row">${tg('oneHit', '한 방에 깨기')}${tg('endless', '시간 무한')}</div>
      <div class="tp-row" style="margin-top:5px">${[1, 2, 4].map((v) => `<button class="btn" data-sp="${v}" aria-pressed="${TEST.speed === v}">속도 ×${v}</button>`).join('')}</div></div>
    <div><h4>스킬 지도</h4><div class="tp-row">${tg('noFog', '안개 걷기')}</div></div>
    <div><h4>테스트판</h4><div class="tp-row"><button class="btn" data-do="copy">진짜 게임 상태 가져오기</button><button class="btn" data-do="fresh">처음부터</button></div>
      <p class="tp-note" style="margin-top:6px">여기서 한 것은 진짜 게임과 따로 저장돼요. 다시 열면 이어져요. 랭킹에는 올라가지 않아요. 나가려면 「나가기」나 로고 7번.</p></div>
  </div>`;
  if (min) p.classList.add('min');
  if (tpPos) { p.style.left = tpPos.x + 'px'; p.style.top = tpPos.y + 'px'; }
  p.querySelectorAll('[data-do]').forEach((b) => (b.onclick = () => { sfx('buy'); testDo(b.dataset.do); }));
  p.querySelectorAll('[data-tg]').forEach((b) => (b.onclick = () => {
    TEST[b.dataset.tg] = !TEST[b.dataset.tg];
    if (b.dataset.tg === 'noFog') { seenFront = null; if (tab === 'tree' && !sess) renderView(); }
    if (sess && b.dataset.tg === 'endless' && TEST.endless) sess.timeLeft = 1e9;
    if (sess && b.dataset.tg === 'endless' && !TEST.endless) sess.timeLeft = Math.min(sess.timeLeft, sess.st.time);
    drawTest();
  }));
  p.querySelectorAll('[data-sp]').forEach((b) => (b.onclick = () => { TEST.speed = +b.dataset.sp; drawTest(); }));
  p.querySelector('[data-a="exit"]').onclick = exitTest;
  p.querySelector('[data-a="min"]').onclick = () => { p.classList.toggle('min'); drawTest(); };
  // 머리를 끌어서 옮기기
  const hd = p.querySelector('header');
  hd.onpointerdown = (e) => {
    if (e.target.closest('button')) return;
    const r = p.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
    hd.setPointerCapture(e.pointerId);
    hd.onpointermove = (ev) => { tpPos = { x: Math.max(0, Math.min(innerWidth - 80, ev.clientX - ox)), y: Math.max(0, Math.min(innerHeight - 40, ev.clientY - oy)) }; p.style.left = tpPos.x + 'px'; p.style.top = tpPos.y + 'px'; };
    hd.onpointerup = () => { hd.onpointermove = null; };
  };
}
$('#testBadge').onclick = () => { const p = $('#testPanel'); if (p) { p.classList.remove('min'); drawTest(); } };

// ── 시작 ─────────────────────────────────────────
function boot() {
  buildBag(); drawSoundBtn();
  S = load();
  let fresh = false;
  if (!S) { S = MG.newState(Date.now()); fresh = true; save(); }
  // 꺼 둔 동안 자동 광산
  const away = Math.min(8 * 3600, (Date.now() - (S.lastSeen || Date.now())) / 1000);
  if (away > 60 && MG.stats(S).mine) {
    const got = MG.idle(S, away);
    const txt = got.map((n, t) => (n ? `${T[t].name} ${MG.fmt(n)}` : '')).filter(Boolean).join(', ');
    if (txt) setTimeout(() => toast(`자리를 비운 동안 자동 광산이 캤어요: ${txt}`), 400);
  }
  save();
  setTab('tree');
  refresh();
  if (fresh) { if (SERVER) startRun(); setTimeout(openHelp, 300); }
  if (SERVER) loadBoard();
  if (S.cleared && S.run && (!S.runResult || S.runResult.retry)) reportClear();
}
document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { setTab(b.dataset.tab); if (b.dataset.tab === 'rank' && SERVER) loadBoard(); }));
$('#goBtn').onclick = startSession;
$('#menuBtn').onclick = openMenu;
$('#soundBtn').onclick = () => { prefs.sound = !prefs.sound; savePrefs(); drawSoundBtn(); if (prefs.sound) sfx('buy'); };
$('#narrowGo').onclick = () => $('#narrow').classList.add('dismissed');
$('#view').addEventListener('scroll', hideTip);
addEventListener('resize', () => { if (sess) { fit(); rockCache.clear(); } });
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (document.querySelector('.modal')) { if (e.key === 'Escape') document.querySelector('.modal').remove(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!sess && !$('#camp').hidden) startSession();
    else if (sess && sess.done && !$('#result').hidden) { closeMine(); startSession(); }
  } else if (e.key === 'Escape') {
    if (sess && !sess.done) { sess.over = true; endSessionNow(true); }
    else if (sess && sess.done) toCamp();
  } else if (/^[123]$/.test(e.key) && !sess && tab === 'talent' && S.pts > 0) takeCard(+e.key - 1);
  else if (e.key === 'm' || e.key === 'M') $('#soundBtn').click();
});
// 1초마다: 자동 광산, 시계, 저장
let lastIdle = Date.now(), lastSave = Date.now();
setInterval(() => {
  if (!S) return;
  const now = Date.now();
  if (document.visibilityState === 'visible') {
    const got = MG.idle(S, Math.min(8 * 3600, (now - lastIdle) / 1000));
    if (got.some((n) => n) && !sess) drawDots();
    lastIdle = now;
  }
  drawTop();
  const rk = $('#rkClock'); if (rk) rk.textContent = MG.fmtTime(runMs());
  if (now - lastSave > 5000) { save(); lastSave = now; }
}, 1000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else {
  // 숨겨 둔 동안은 꺼 둔 것처럼 계산
  const away = Math.min(8 * 3600, (Date.now() - lastIdle) / 1000);
  if (away > 2) MG.idle(S, away);
  lastIdle = Date.now();
} });
boot();
</script>
