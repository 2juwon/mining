<title>광산 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 왼쪽 넓은 채굴장(WebGL) + 오른쪽 실험 손잡이 칸. 본 게임과 같은 갱도·등불 색 */
:root {
  --soot: #110e0c; --rock: #1c1714; --rock-2: #272019; --seam: #3d3229;
  --dust: #a8967f; --parch: #f1e6d2; --lamp: #f2a541; --ember: #ff6a3d; --moss: #9bd17f;
  --display: "Hahmlet", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--soot); color: var(--parch); font: 13px/1.5 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
#lab { height: 100%; display: grid; grid-template-columns: 1fr 300px; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#stage { position: relative; min-width: 0; overflow: hidden; background: #0b0908; cursor: none; touch-action: none; }
#stage canvas { display: block; }
.hud { position: absolute; left: 14px; top: 12px; pointer-events: none; text-shadow: 0 1px 6px #000; display: flex; flex-direction: column; gap: 6px; }
.hud .title { font: 900 20px var(--display); color: var(--lamp); }
.hud .title small { font: 500 12px var(--body); color: var(--dust); margin-left: 6px; }
.meters { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.meters b { display: block; font: 900 22px var(--display); color: var(--parch); line-height: 1.1; }
.meters span { color: var(--dust); font-size: 11px; }
.meters .bad b { color: var(--ember); }
.gains { display: flex; flex-wrap: wrap; gap: 4px; max-width: 520px; }
.gains i { font-style: normal; display: inline-flex; align-items: center; gap: 4px; background: rgba(28,23,20,.8); border-radius: 6px; padding: 1px 7px 1px 4px; font-variant-numeric: tabular-nums; font-size: 12px; }
.gains i::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); transform: rotate(45deg); }
.combo { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font: 900 34px var(--display); color: var(--lamp); text-shadow: 0 2px 14px rgba(0,0,0,.9); pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
.combo.on { opacity: 1; }
.combo small { font: 700 14px var(--body); color: var(--parch); margin-left: 6px; }
.panel { background: var(--rock); border-left: 1px solid var(--seam); overflow: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.panel h1 { margin: 0; font: 900 20px var(--display); color: var(--lamp); }
.panel p.note { margin: 0; color: var(--dust); font-size: 12px; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl label { display: flex; justify-content: space-between; font-weight: 700; font-size: 12px; }
.ctl label output { color: var(--lamp); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--lamp); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button, .btn { border: 1px solid var(--seam); background: var(--rock-2); color: var(--parch); border-radius: 8px; padding: 6px 10px; font: 700 12px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--lamp); color: #2a1606; border-color: var(--lamp); }
.btn.big { padding: 10px; font-size: 14px; }
.btn.hot { background: var(--ember); border-color: var(--ember); color: #fff; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums; background: var(--soot); border: 1px solid var(--seam); border-radius: 10px; padding: 8px 10px; }
.stats span { color: var(--dust); }
.stats b { text-align: right; font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dust); }
@media (max-width: 760px) {
  #lab { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  .panel { border-left: 0; border-top: 1px solid var(--seam); }
  .gains { display: none; }
}
@media (prefers-reduced-motion: reduce) { .combo { transition: none; } }
</style>

<div id="lab">
  <div id="stage">
    <div class="hud">
      <div class="title">광산 실험실<small>바위 수천 개 시험판 · 본 게임과 따로</small></div>
      <div class="meters">
        <div id="mFps"><b>–</b><span>프레임/초</span></div>
        <div><b id="mAlive">0</b><span>바위</span></div>
        <div><b id="mRate">0</b><span>깬 바위/초</span></div>
        <div><b id="mTotal">0</b><span>깬 바위 합계</span></div>
      </div>
      <div class="gains" id="gains"></div>
    </div>
    <div class="combo" id="combo"></div>
  </div>
  <aside class="panel">
    <h1>실험 손잡이</h1>
    <p class="note">바위를 끝 무렵 5,000개까지 늘렸을 때 컴퓨터가 버티는지, 깨는 맛이 어떤지 보는 판이에요. 마우스를 채굴장 위에 올려 두면 캐요. 저장은 하지 않아요.</p>
    <div class="ctl"><label for="cN">한 화면 바위 수 <output id="oN"></output></label><input type="range" id="cN" min="100" max="5000" step="100" value="2000"></div>
    <div class="ctl"><label for="cRefill">다시 꽉 차기까지 <output id="oRefill"></output></label><input type="range" id="cRefill" min="0.2" max="5" step="0.1" value="1"></div>
    <div class="ctl"><label for="cRad">고리 크기 <output id="oRad"></output></label><input type="range" id="cRad" min="30" max="400" step="5" value="130"></div>
    <div class="ctl"><label for="cSwing">휘두르는 간격 <output id="oSwing"></output></label><input type="range" id="cSwing" min="0.05" max="1" step="0.05" value="0.25"></div>
    <div class="ctl"><label>바위 단단함</label><div class="seg" id="sHits"><button data-v="1">한 방</button><button data-v="2" aria-pressed="true">두 방</button><button data-v="4">네 방</button><button data-v="8">여덟 방</button></div></div>
    <div class="ctl"><label for="cBoom">깨질 때 폭발 확률 <output id="oBoom"></output></label><input type="range" id="cBoom" min="0" max="0.6" step="0.01" value="0.1"></div>
    <div class="ctl"><label for="cBoomR">폭발 범위 <output id="oBoomR"></output></label><input type="range" id="cBoomR" min="20" max="200" step="5" value="70"></div>
    <div class="ctl"><label for="cZap">때릴 때 번개 확률 <output id="oZap"></output></label><input type="range" id="cZap" min="0" max="0.5" step="0.01" value="0.05"></div>
    <div class="ctl"><label>광석</label><div class="seg" id="sTier"><button data-v="0">돌만</button><button data-v="4">금층까지</button><button data-v="9" aria-pressed="true">모두 섞어서</button></div></div>
    <div class="ctl"><label>파편 양</label><div class="seg" id="sQ"><button data-v="auto" aria-pressed="true">자동</button><button data-v="3">많이</button><button data-v="1.5">보통</button><button data-v="0.5">조금</button></div></div>
    <div class="row2">
      <button class="btn" id="bAuto">자동으로 휘두르기</button>
      <button class="btn" id="bSound">소리 켜기</button>
    </div>
    <button class="btn big hot" id="bBoom">한꺼번에 와르르</button>
    <div class="stats" id="stats"></div>
    <p class="note">프레임이 50 아래로 떨어지면 '자동'이 파편 양을 줄여요. 아래 숫자를 알려 주시면 본 게임에 넣을 때 기준으로 쓸게요.</p>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js-legacy@7.4.2/dist/pixi-legacy.min.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const TIERS = [
  ['돌', '#48423c', '#8d8578', 1], ['구리', '#5f4c42', '#e0814a', 1.4], ['철', '#4d4b4c', '#c9cfd6', 1.9], ['은', '#4b5059', '#eef4ff', 2.5],
  ['금', '#544636', '#ffc94a', 3.2], ['수정', '#3c4a5e', '#8fe0ff', 4], ['미스릴', '#334a47', '#7cf2cf', 5], ['아다만트', '#4a2f36', '#ff5f7e', 6.2],
  ['흑요석', '#241d33', '#b28cff', 7.6], ['별철', '#2a2c3d', '#fff3b0', 9.2],
].map(([name, rock, vein, hp]) => ({ name, rock, vein, hp, veinNum: parseInt(vein.slice(1), 16), rockNum: parseInt(rock.slice(1), 16) }));
const CAP = 5000;              // 바위 최대
const VAR = 8, CRACK = 4, CELL = 64; // 바위 모양 가지 수, 금 단계, 그림 칸 크기

// ── 설정 ──
const P = { N: 2000, refill: 1, rad: 130, swing: 0.25, hits: 2, boom: 0.1, boomR: 70, zap: 0.05, maxTier: 9, q: 'auto', auto: false, sound: false };
let qMul = 1.5; // 파편 배수 (자동이면 프레임에 따라 바뀜)
function bindRange(id, out, key, fmt) {
  const el = $('#' + id), o = $('#' + out);
  const set = () => { P[key] = +el.value; o.textContent = fmt(P[key]); };
  el.addEventListener('input', set); set();
}
bindRange('cN', 'oN', 'N', (v) => v.toLocaleString('ko-KR') + '개');
bindRange('cRefill', 'oRefill', 'refill', (v) => v.toFixed(1) + '초');
bindRange('cRad', 'oRad', 'rad', (v) => v + 'px');
bindRange('cSwing', 'oSwing', 'swing', (v) => v.toFixed(2) + '초');
bindRange('cBoom', 'oBoom', 'boom', (v) => Math.round(v * 100) + '%');
bindRange('cBoomR', 'oBoomR', 'boomR', (v) => v + 'px');
bindRange('cZap', 'oZap', 'zap', (v) => Math.round(v * 100) + '%');
function bindSeg(id, key, parse) {
  const root = $('#' + id);
  root.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    root.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    P[key] = parse(b.dataset.v);
    if (key === 'q' && P.q !== 'auto') qMul = P.q;
  }));
}
bindSeg('sHits', 'hits', Number);
bindSeg('sTier', 'maxTier', Number);
bindSeg('sQ', 'q', (v) => (v === 'auto' ? 'auto' : +v));
$('#bAuto').onclick = () => { P.auto = !P.auto; $('#bAuto').textContent = P.auto ? '자동 멈추기' : '자동으로 휘두르기'; };
$('#bSound').onclick = () => { P.sound = !P.sound; $('#bSound').textContent = P.sound ? '소리 끄기' : '소리 켜기'; if (P.sound) audio(); };

// ── Pixi 준비 ──
const stage = $('#stage');
let app;
try {
  const forceCanvas = location.hash === '#canvas';
  app = new PIXI.Application({ resizeTo: stage, backgroundColor: 0x0b0908, antialias: false, autoDensity: true, resolution: Math.min(2, window.devicePixelRatio || 1), powerPreference: 'high-performance', forceCanvas });
} catch (e) {
  stage.insertAdjacentHTML('beforeend', '<div class="fail">이 브라우저에서는 그림 엔진을 켜지 못했어요. 그래픽 가속이 꺼져 있는지 확인해 주세요.</div>');
  throw e;
}
stage.prepend(app.view);
const isGL = app.renderer.type === PIXI.RENDERER_TYPE.WEBGL;
const glName = isGL ? 'WebGL ' + (app.renderer.context.webGLVersion || '') : '캔버스(느림)';

// ── 그림 모음(아틀라스): 광석 10 × 모양 8 × 금 4단계 + 파편·고리 ──
function rngOf(seed) { let a = seed >>> 0 || 1; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16), f = (v) => Math.max(0, Math.min(255, v + amt)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
const COLS = 20, ROWS = Math.ceil((10 * VAR * CRACK) / COLS) + 1;
const atlas = document.createElement('canvas'); atlas.width = COLS * CELL; atlas.height = ROWS * CELL;
const ag = atlas.getContext('2d');
function drawRock(cx, cy, t, v, stage4) {
  const T = TIERS[t], r = rngOf(t * 1000 + v * 17 + 3), R = CELL * 0.4;
  ag.save(); ag.translate(cx + CELL / 2, cy + CELL / 2);
  const n = 8 + Math.floor(r() * 4), pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + r() * 0.3, rr = R * (0.8 + r() * 0.28); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.92]); }
  ag.beginPath(); pts.forEach(([x, y], i) => (i ? ag.lineTo(x, y) : ag.moveTo(x, y))); ag.closePath();
  const gr = ag.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, shade(T.rock, 40)); gr.addColorStop(0.55, T.rock); gr.addColorStop(1, shade(T.rock, -30));
  ag.fillStyle = gr; ag.fill(); ag.lineWidth = 2.2; ag.strokeStyle = 'rgba(0,0,0,.6)'; ag.stroke();
  ag.save(); ag.clip();
  const vc = t === 0 ? 3 : 4 + Math.floor(r() * 3);
  for (let i = 0; i < vc; i++) {
    const a = r() * Math.PI * 2, d = r() * R * 0.55, x = Math.cos(a) * d, y = Math.sin(a) * d, s = R * (0.16 + r() * 0.16);
    ag.fillStyle = T.vein; ag.globalAlpha = t === 0 ? 0.3 : 1;
    ag.beginPath(); for (let j = 0; j < 5; j++) { const b = (j / 5) * Math.PI * 2 + r(); ag.lineTo(x + Math.cos(b) * s, y + Math.sin(b) * s); } ag.fill();
    ag.globalAlpha = t === 0 ? 0.15 : 0.7; ag.fillStyle = '#fff'; ag.fillRect(x - s * 0.3, y - s * 0.4, s * 0.35, s * 0.25);
  }
  ag.globalAlpha = 1;
  const hl = ag.createRadialGradient(-R * 0.4, -R * 0.5, 1, -R * 0.4, -R * 0.5, R);
  hl.addColorStop(0, 'rgba(255,240,220,.25)'); hl.addColorStop(1, 'rgba(255,240,220,0)'); ag.fillStyle = hl; ag.fillRect(-R * 2, -R * 2, R * 4, R * 4);
  // 금
  ag.strokeStyle = 'rgba(8,5,3,.9)'; ag.lineWidth = 2; ag.lineCap = 'round';
  for (let c = 0; c < stage4 * 2; c++) {
    const a = r() * Math.PI * 2; let x = Math.cos(a) * R * 0.1, y = Math.sin(a) * R * 0.1;
    ag.beginPath(); ag.moveTo(x, y);
    for (let j = 0; j < 3; j++) { const b = a + (r() - 0.5) * 1.1; x += Math.cos(b) * R * 0.3; y += Math.sin(b) * R * 0.3; ag.lineTo(x, y); }
    ag.stroke();
  }
  ag.restore(); ag.restore();
}
let k = 0;
for (let t = 0; t < 10; t++) for (let v = 0; v < VAR; v++) for (let c = 0; c < CRACK; c++, k++) drawRock((k % COLS) * CELL, Math.floor(k / COLS) * CELL, t, v, c);
// 마지막 줄: 파편(흰 네모), 빛 점, 고리, 번쩍임
const FY = (ROWS - 1) * CELL;
ag.fillStyle = '#fff'; ag.fillRect(4, FY + 4, 24, 24);
const dot = ag.createRadialGradient(CELL + 32, FY + 32, 0, CELL + 32, FY + 32, 30); dot.addColorStop(0, 'rgba(255,255,255,1)'); dot.addColorStop(0.35, 'rgba(255,255,255,.6)'); dot.addColorStop(1, 'rgba(255,255,255,0)');
ag.fillStyle = dot; ag.fillRect(CELL, FY, CELL, CELL);
ag.strokeStyle = '#fff'; ag.lineWidth = 5; ag.beginPath(); ag.arc(CELL * 2 + 32, FY + 32, 27, 0, Math.PI * 2); ag.stroke();
const base = PIXI.BaseTexture.from(atlas);
const rockTex = [];
k = 0;
for (let t = 0; t < 10; t++) { rockTex[t] = []; for (let v = 0; v < VAR; v++) { rockTex[t][v] = []; for (let c = 0; c < CRACK; c++, k++) rockTex[t][v][c] = new PIXI.Texture(base, new PIXI.Rectangle((k % COLS) * CELL, Math.floor(k / COLS) * CELL, CELL, CELL)); } }
const texChip = new PIXI.Texture(base, new PIXI.Rectangle(4, FY + 4, 24, 24));
const texDot = new PIXI.Texture(base, new PIXI.Rectangle(CELL, FY, CELL, CELL));
const texRing = new PIXI.Texture(base, new PIXI.Rectangle(CELL * 2, FY, CELL, CELL));

// ── 장면 ──
const world = new PIXI.Container(); app.stage.addChild(world);
let bgSprite = null;
function makeBg() {
  const w = Math.ceil(app.screen.width), h = Math.ceil(app.screen.height);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), r = rngOf(7);
  g.fillStyle = '#0d0a08'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h, s = 20 + r() * 90; g.fillStyle = `rgba(${40 + r() * 30},${32 + r() * 22},${26 + r() * 18},${0.25 + r() * 0.35})`; g.beginPath(); for (let k2 = 0; k2 < 7; k2++) { const a = (k2 / 7) * Math.PI * 2, rr = s * (0.5 + r() * 0.5); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.6); } g.fill(); }
  const fg = g.createRadialGradient(w / 2, h / 2, h * 0.1, w / 2, h / 2, Math.max(w, h) * 0.7); fg.addColorStop(0, '#3a2e24'); fg.addColorStop(0.7, '#1e1712'); fg.addColorStop(1, 'rgba(10,8,6,.9)');
  g.fillStyle = fg; g.globalAlpha = 0.85; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${150 + r() * 60},${120 + r() * 50},${90 + r() * 40},${0.04 + r() * 0.06})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 2); }
  if (bgSprite) { bgSprite.texture.destroy(true); world.removeChild(bgSprite); }
  bgSprite = new PIXI.Sprite(PIXI.Texture.from(c)); world.addChildAt(bgSprite, 0);
}
makeBg();
const rockLayer = new PIXI.ParticleContainer(CAP, { vertices: true, position: true, uvs: true, tint: true, rotation: false });
world.addChild(rockLayer);
const PMAX = 16000;
const partLayer = new PIXI.ParticleContainer(PMAX, { vertices: true, position: true, rotation: true, tint: true, uvs: false });
partLayer.blendMode = PIXI.BLEND_MODES.NORMAL;
world.addChild(partLayer);
const fxLayer = new PIXI.Container(); world.addChild(fxLayer);
const glowLayer = new PIXI.ParticleContainer(2000, { vertices: true, position: true, tint: true });
glowLayer.blendMode = PIXI.BLEND_MODES.ADD;
world.addChild(glowLayer);
const gfx = new PIXI.Graphics(); world.addChild(gfx);

// ── 바위 (슬롯 배열) ──
const R = { x: new Float32Array(CAP), y: new Float32Array(CAP), hp: new Float32Array(CAP), max: new Float32Array(CAP), tier: new Uint8Array(CAP), v: new Uint8Array(CAP), alive: new Uint8Array(CAP), born: new Float32Array(CAP), kick: new Float32Array(CAP), crack: new Uint8Array(CAP), sp: [] };
for (let i = 0; i < CAP; i++) { const s = new PIXI.Sprite(rockTex[0][0][0]); s.anchor.set(0.5); s.alpha = 0; s.x = -100; rockLayer.addChild(s); R.sp.push(s); }
let free = []; for (let i = CAP - 1; i >= 0; i--) free.push(i);
let alive = 0;
let rockR = 10; // 바위 반지름 (바위 수에 따라)
function sizeFor(N) {
  const area = app.screen.width * app.screen.height * 0.9;
  return Math.max(4.5, Math.min(24, Math.sqrt(area / N) * 0.38));
}
// 칸 나누기: 매 프레임 살아 있는 바위를 칸에 담아 둠 (근처만 찾기)
const G = { size: 40, cols: 1, rows: 1, start: null, items: null };
function buildGrid() {
  G.size = Math.max(24, rockR * 4);
  G.cols = Math.ceil(app.screen.width / G.size) + 1; G.rows = Math.ceil(app.screen.height / G.size) + 1;
  const nc = G.cols * G.rows;
  if (!G.count || G.count.length < nc + 1) { G.count = new Int32Array(nc + 1); G.start = new Int32Array(nc + 1); }

// ── 파편 ──
const PT = { x: new Float32Array(PMAX), y: new Float32Array(PMAX), vx: new Float32Array(PMAX), vy: new Float32Array(PMAX), life: new Float32Array(PMAX), ttl: new Float32Array(PMAX), sz: new Float32Array(PMAX), rot: new Float32Array(PMAX), vr: new Float32Array(PMAX), sp: [] };

// 빛 점 (번쩍임)
const GL = { n: 0, max: 2000, x: new Float32Array(2000), y: new Float32Array(2000), life: new Float32Array(2000), ttl: new Float32Array(2000), sz: new Float32Array(2000), sp: [] };
for (let i = 0; i < GL.max; i++) { const s = new PIXI.Sprite(texDot); s.anchor.set(0.5); s.alpha = 0; glowLayer.addChild(s); GL.sp.push(s); }

}

// 폭발 고리 (보통 스프라이트, 몇 개만)

// ── 소리 ──
let AC = null, master = null, noiseBuf = null;

  if (n > 12 && now - rumbleT > 0.12) { // 와르르

// ── 게임 진행 ──
let mouse = null, swingT = 0, tNow = 0, shake = 0;
const booms = []; // 예약된 폭발 (연쇄가 물결처럼 퍼지게 조금씩 늦춤)
const zaps = [];
const gained = TIERS.map(() => 0), gainedRecent = TIERS.map(() => 0);
let totalBroken = 0, brokenThisFrame = 0, rateWin = [], combo = 0, comboT = 0, comboMax = 0;
stage.addEventListener('pointermove', (e) => { const r = stage.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; });
stage.addEventListener('pointerleave', () => { if (!P.auto) mouse = null; });
function damage(i, d) {

// ── 매 프레임 ──

// ── 숫자 표시 (4번/초) ──
